<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Glowing Blue Ring -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Inner Dark Blue/Slate Circle -->
  <circle cx="32" cy="32" r="26" fill="url(#innerGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
  
  <!-- Reticle / Vision Crosshair lines -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.5"/>
  <line x1="32" y1="8" x2="32" y2="14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="56" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="32" x2="14" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="56" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 3 Bowling Ball / AI Sensor Nodes in Cyan & Gold -->
  <circle cx="26" cy="25" r="3.2" fill="#38bdf8"/>
  <circle cx="38" cy="25" r="3.2" fill="#38bdf8"/>
  <circle cx="32" cy="37" r="3.2" fill="#eab308"/>
  
  <!-- Center AI Core Pulse -->
  <circle cx="32" cy="28" r="1" fill="#ffffff"/>
</svg>
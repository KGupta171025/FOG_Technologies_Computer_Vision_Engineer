[project]
name = "fog-scoreboard-extraction"
version = "1.0.0"
description = "Production-quality computer vision pipeline to extract bowling scoreboard data from video feeds."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "easyocr>=1.7.1",
    "pandas>=2.0.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoreboard_extractor"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = []
exclude = [".git", "__pycache__", "build", "dist", ".venv"]
